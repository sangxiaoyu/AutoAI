<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>简单翻译程序</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            width: 100%;
            max-width: 800px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        .header {
            background: #4a90e2;
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }
        
        .header p {
            opacity: 0.9;
            font-size: 14px;
        }
        
        .translator {
            padding: 30px;
        }
        
        .language-selector {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 15px;
        }
        
        .select-box {
            flex: 1;
        }
        
        .select-box select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
            background: white;
            cursor: pointer;
        }
        
        .select-box select:focus {
            border-color: #4a90e2;
        }
        
        .swap-button {
            background: #f0f0f0;
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            font-size: 20px;
        }
        
        .swap-button:hover {
            background: #4a90e2;
            color: white;
            transform: rotate(180deg);
        }
        
        .text-boxes {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .text-box {
            flex: 1;
        }
        
        .text-box label {
            display: block;
            margin-bottom: 8px;
            color: #666;
            font-weight: 500;
        }
        
        .text-box textarea {
            width: 100%;
            height: 150px;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            resize: none;
            outline: none;
            transition: border-color 0.3s;
            font-family: inherit;
        }
        
        .text-box textarea:focus {
            border-color: #4a90e2;
        }
        
        .text-box textarea[readonly] {
            background-color: #f9f9f9;
        }
        
        .button-group {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }
        
        .translate-btn {
            background: #4a90e2;
            color: white;
            border: none;
            padding: 14px 40px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
            flex: 1;
        }
        
        .translate-btn:hover {
            background: #357abd;
        }
        
        .clear-btn {
            background: #f0f0f0;
            color: #666;
            border: none;
            padding: 14px 30px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .clear-btn:hover {
            background: #e0e0e0;
        }
        
        .loading {
            display: none;
            text-align: center;
            margin: 15px 0;
            color: #4a90e2;
        }
        
        .loading.active {
            display: block;
        }
        
        .loading::after {
            content: '';
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f0f0f0;
            border-top-color: #4a90e2;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-left: 10px;
            vertical-align: middle;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .footer {
            text-align: center;
            padding: 20px;
            background: #f9f9f9;
            color: #999;
            font-size: 12px;
            border-top: 1px solid #e0e0e0;
        }
        
        .error-message {
            color: #e74c3c;
            text-align: center;
            margin: 10px 0;
            display: none;
        }
        
        .error-message.active {
            display: block;
        }
        
        @media (max-width: 600px) {
            .text-boxes {
                flex-direction: column;
            }
            
            .language-selector {
                flex-direction: column;
            }
            
            .swap-button {
                transform: rotate(90deg);
            }
            
            .swap-button:hover {
                transform: rotate(270deg);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"/>
                    <line x1="2" y1="12" x2="22" y2="12"/>
                    <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
                </svg>
            </div>
            <div class="header-title">
                <h1>智能翻译</h1>
                <p>支持多种语言互译 | 简单快速 | 完全免费</p>
            </div>
        </div>
        
        <div class="translator">
            <!-- 公众号广告位 -->
            <div id="ad1" class="ad-container">
                <button class="ad-close-btn" onclick="hideAdWithAnimation('ad1')" aria-label="关闭广告">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
                <div class="ad-placeholder">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="2" y="7" width="20" height="14" rx="2" ry="2"/>
                        <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>
                    </svg>
                    <span>广告位</span>
                </div>
            </div>
            <div class="language-selector">
                <div class="select-box">
                    <select id="sourceLang">
                        <option value="auto">自动检测</option>
                        <option value="zh" selected>中文</option>
                        <option value="en">英语</option>
                        <option value="ja">日语</option>
                        <option value="ko">韩语</option>
                        <option value="fr">法语</option>
                        <option value="de">德语</option>
                        <option value="es">西班牙语</option>
                        <option value="ru">俄语</option>
                        <option value="ar">阿拉伯语</option>
                        <option value="th">泰语</option>
                    </select>
                </div>
                
                <button class="swap-button" id="swapLang" title="交换语言">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M7 16V4M7 4L3 8M7 4L11 8M17 8v12M17 20l-4-4M17 20l4-4"/>
                    </svg>
                </button>
                
                <div class="select-box">
                    <select id="targetLang">
                        <option value="zh">中文</option>
                        <option value="en" selected>英语</option>
                        <option value="ja">日语</option>
                        <option value="ko">韩语</option>
                        <option value="fr">法语</option>
                        <option value="de">德语</option>
                        <option value="es">西班牙语</option>
                        <option value="ru">俄语</option>
                        <option value="ar">阿拉伯语</option>
                        <option value="th">泰语</option>
                    </select>
                </div>
            </div>
            
            <div class="text-boxes">
                <div class="text-box">
                    <label for="sourceText">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                        </svg>
                        原文
                    </label>
                    <textarea id="sourceText" placeholder="请输入要翻译的文本..."></textarea>
                </div>
                
                <div class="text-box">
                    <label for="targetText">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
                            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
                        </svg>
                        译文
                    </label>
                    <textarea id="targetText" placeholder="翻译结果将显示在这里..." readonly></textarea>
                </div>
            </div>
            
            <div class="loading" id="loading">正在翻译</div>
            <div class="error-message" id="errorMessage"></div>
            
            <div class="button-group">
                <button class="clear-btn" id="clearBtn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="3 6 5 6 21 6"/>
                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                    </svg>
                    清空
                </button>
                <button class="translate-btn" id="translateBtn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"/>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                    </svg>
                    立即翻译
                </button>
            </div>
        </div>
        
        <div class="footer">
            © 2024 智能翻译 | design by <a href="https://github.com/sangxiaoyu">xiaoyu</a> | 每日限额100次翻译
        </div>
    </div>

    <script src="js/translate.js"></script>
    <script src="js/ad-manager.js"></script>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const sourceText = document.getElementById('sourceText');
            const targetText = document.getElementById('targetText');
            const sourceLang = document.getElementById('sourceLang');
            const targetLang = document.getElementById('targetLang');
            const translateBtn = document.getElementById('translateBtn');
            const swapBtn = document.getElementById('swapLang');
            const clearBtn = document.getElementById('clearBtn');
            const loading = document.getElementById('loading');
            const errorMessage = document.getElementById('errorMessage');
            
            // 翻译函数
            async function translate() {
                const text = sourceText.value.trim();
                
                if (!text) {
                    showError('请输入要翻译的文本');
                    return;
                }
                
                const fromLang = sourceLang.value;
                const toLang = targetLang.value;
                
                // 如果源语言和目标语言相同
                if (fromLang === toLang && fromLang !== 'auto') {
                    showError('源语言和目标语言不能相同');
                    return;
                }
                
                // 显示加载状态
                loading.classList.add('active');
                errorMessage.classList.remove('active');
                targetText.value = '';
                
                try {
                    // 使用 MyMemory API (免费，无需API密钥)
                    const langPair = fromLang === 'auto' ? `${toLang}` : `${fromLang}|${toLang}`;
                    const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${langPair}`;
                    
                    const response = await fetch(url);
                    const data = await response.json();
                    
                    if (data.responseStatus === 200 && data.responseData) {
                        targetText.value = data.responseData.translatedText;
                        
                        // 如果有匹配度信息，可以在控制台查看
                        console.log('匹配度:', data.responseData.match);
                    } else {
                        throw new Error('翻译失败，请稍后重试');
                    }
                } catch (error) {
                    console.error('翻译错误:', error);
                    showError('翻译失败，请检查网络后重试');
                } finally {
                    loading.classList.remove('active');
                }
            }
            
            // 显示错误信息
            function showError(message) {
                errorMessage.textContent = message;
                errorMessage.classList.add('active');
            }
            
            // 交换语言
            function swapLanguages() {
                const sourceVal = sourceLang.value;
                const targetVal = targetLang.value;
                
                // 如果源语言是自动检测，不能交换
                if (sourceVal === 'auto') {
                    showError('自动检测语言不能作为目标语言');
                    return;
                }
                
                sourceLang.value = targetVal;
                targetLang.value = sourceVal;
                
                // 交换文本框内容
                const sourceTextValue = sourceText.value;
                const targetTextValue = targetText.value;
                
                if (sourceTextValue || targetTextValue) {
                    sourceText.value = targetTextValue;
                    targetText.value = '';
                    
                    if (targetTextValue) {
                        // 如果有译文，自动翻译回来
                        setTimeout(() => translate(), 100);
                    }
                }
            }
            
            // 清空所有内容
            function clearAll() {
                sourceText.value = '';
                targetText.value = '';
                errorMessage.classList.remove('active');
            }
            
            // 事件监听
            translateBtn.addEventListener('click', translate);
            swapBtn.addEventListener('click', swapLanguages);
            clearBtn.addEventListener('click', clearAll);
            
            // 快捷键：Ctrl + Enter 翻译
            sourceText.addEventListener('keydown', function(e) {
                if (e.ctrlKey && e.key === 'Enter') {
                    translate();
                }
            });
            
            // 输入时清除错误提示
            sourceText.addEventListener('input', function() {
                errorMessage.classList.remove('active');
            });
            
            // 示例：默认显示一些示例文本
            sourceText.value = 'Hello, how are you?';
            setTimeout(() => translate(), 500);
        });
    </script>
</body>
</html>
