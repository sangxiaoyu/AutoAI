<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>翻译工具</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"/>
                    <line x1="2" y1="12" x2="22" y2="12"/>
                    <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
                </svg>
            </div>
            <div class="header-title">
                <h1>智能翻译</h1>
                <p>支持多种语言互译 | 简单快速 | 完全免费</p>
            </div>
        </div>
        
        <div class="translator">
            <!-- 公众号广告位 -->
            <div id="ad1" class="ad-container">
                <button class="ad-close-btn" onclick="hideAdWithAnimation('ad1')" aria-label="关闭广告">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
                <div class="ad-placeholder">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="2" y="7" width="20" height="14" rx="2" ry="2"/>
                        <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>
                    </svg>
                    <span>广告位</span>
                </div>
            </div>
            <div class="language-selector">
                <div class="select-box">
                    <select id="sourceLang">
                        <option value="auto">自动检测</option>
                        <option value="zh" selected>中文</option>
                        <option value="en">英语</option>
                        <option value="ja">日语</option>
                        <option value="ko">韩语</option>
                        <option value="fr">法语</option>
                        <option value="de">德语</option>
                        <option value="es">西班牙语</option>
                        <option value="ru">俄语</option>
                        <option value="ar">阿拉伯语</option>
                        <option value="th">泰语</option>
                    </select>
                </div>
                
                <button class="swap-button" id="swapLang" title="交换语言">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M7 16V4M7 4L3 8M7 4L11 8M17 8v12M17 20l-4-4M17 20l4-4"/>
                    </svg>
                </button>
                
                <div class="select-box">
                    <select id="targetLang">
                        <option value="zh">中文</option>
                        <option value="en" selected>英语</option>
                        <option value="ja">日语</option>
                        <option value="ko">韩语</option>
                        <option value="fr">法语</option>
                        <option value="de">德语</option>
                        <option value="es">西班牙语</option>
                        <option value="ru">俄语</option>
                        <option value="ar">阿拉伯语</option>
                        <option value="th">泰语</option>
                    </select>
                </div>
            </div>
            
            <div class="text-boxes">
                <div class="text-box">
                    <label for="sourceText">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                        </svg>
                        原文
                    </label>
                    <textarea id="sourceText" placeholder="请输入要翻译的文本..."></textarea>
                </div>
                
                <div class="text-box">
                    <label for="targetText">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
                            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
                        </svg>
                        译文
                    </label>
                    <textarea id="targetText" placeholder="翻译结果将显示在这里..." readonly></textarea>
                </div>
            </div>
            
            <div class="loading" id="loading">正在翻译</div>
            <div class="error-message" id="errorMessage"></div>
            
            <div class="button-group">
                <button class="clear-btn" id="clearBtn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="3 6 5 6 21 6"/>
                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                    </svg>
                    清空
                </button>
                <button class="translate-btn" id="translateBtn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"/>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                    </svg>
                    立即翻译
                </button>
            </div>
        </div>
        
        <div class="footer">
            © 2026 智能翻译 | design by <a href="https://github.com/sangxiaoyu">小榆</a> | 每日限额100次翻译
            <div class="mobile-hint" id="mobileHint">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="5" y="2" width="14" height="20" rx="2" ry="2"/>
                    <path d="M12 18h.01"/>
                </svg>
                <span>移动设备优化版</span>
            </div>
        </div>
    </div>

    <script src="js/translate.js?v=1.0.2"></script>
    <script src="js/ad-manager.js?v=1.0.2"></script>
    <script src="js/fastclick.js?v=1.0.0"></script>
    <script src="js/mobile-optimize.js?v=1.0.0"></script>
    
    <!-- 移动设备优化脚本 -->
    <script>
        // 移动设备检测
        function isMobileDevice() {
            return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) ||
                   (window.innerWidth <= 768 && window.innerHeight <= 1024);
        }
        
        // 移动设备优化
        if (isMobileDevice()) {
            document.addEventListener('DOMContentLoaded', function() {
                // 阻止双击缩放
                let lastTouchEnd = 0;
                document.addEventListener('touchend', function(e) {
                    const now = Date.now();
                    if (now - lastTouchEnd <= 300) {
                        e.preventDefault();
                    }
                    lastTouchEnd = now;
                }, false);
                
                // 优化点击延迟
                if ('addEventListener' in document) {
                    document.addEventListener('DOMContentLoaded', function() {
                        FastClick.attach(document.body);
                    }, false);
                }
                
                // 检测横竖屏变化
                window.addEventListener('orientationchange', function() {
                    // 屏幕旋转后重新计算布局
                    setTimeout(function() {
                        window.scrollTo(0, 0);
                    }, 300);
                });
                
                // 移动设备性能优化：减少重绘
                let resizeTimer;
                window.addEventListener('resize', function() {
                    if (resizeTimer) clearTimeout(resizeTimer);
                    resizeTimer = setTimeout(function() {
                        // 屏幕大小变化后优化布局
                    }, 250);
                });
            });
        }
        
        // 移动设备虚拟键盘收起时优化
        document.addEventListener('visibilitychange', function() {
            if (document.hidden && isMobileDevice()) {
                // 当用户切换到其他应用时，保存当前状态
                const sourceText = document.getElementById('sourceText');
                const targetText = document.getElementById('targetText');
                const sourceLang = document.getElementById('sourceLang');
                const targetLang = document.getElementById('targetLang');
                
                try {
                    localStorage.setItem('translate_sourceText', sourceText.value);
                    localStorage.setItem('translate_targetText', targetText.value);
                    localStorage.setItem('translate_sourceLang', sourceLang.value);
                    localStorage.setItem('translate_targetLang', targetLang.value);
                } catch (e) {
                    console.log('本地存储失败:', e);
                }
            }
        });
        
        // 页面恢复时恢复状态
        window.addEventListener('pageshow', function() {
            if (isMobileDevice()) {
                try {
                    const savedSourceText = localStorage.getItem('translate_sourceText');
                    const savedTargetText = localStorage.getItem('translate_targetText');
                    const savedSourceLang = localStorage.getItem('translate_sourceLang');
                    const savedTargetLang = localStorage.getItem('translate_targetLang');
                    
                    if (savedSourceText) {
                        const sourceText = document.getElementById('sourceText');
                        const targetText = document.getElementById('targetText');
                        const sourceLang = document.getElementById('sourceLang');
                        const targetLang = document.getElementById('targetLang');
                        
                        sourceText.value = savedSourceText;
                        targetText.value = savedTargetText || '';
                        sourceLang.value = savedSourceLang || 'auto';
                        targetLang.value = savedTargetLang || 'en';
                    }
                } catch (e) {
                    console.log('状态恢复失败:', e);
                }
            }
        });
    </script>
</body>
</html>
